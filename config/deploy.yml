# Kamal deploy for a single server running the web app, Sidekiq, Postgres,
# three Valkey instances (jobs, cache, Action Cable) and a Cloudflare Tunnel.
# See docs/DEPLOYMENT.md.
#
# This file is public, so it holds no hosts, IPs or secrets. Kamal reads it
# through ERB: hosts and names come from ENV, and secrets from .kamal/secrets.
# CI deploys on every push to main (.github/workflows/ci.yml).
#
# The server publishes no HTTP ports. cloudflared (the "tunnel" accessory)
# connects out to Cloudflare and forwards requests to kamal-proxy over the
# private "kamal" Docker network, so the server's IP never appears in DNS.

<% web_host = ENV.fetch("KAMAL_WEB_HOST") %>
<%
  # Optional deploy-time settings (docs/DEPLOYMENT.md, "Valkey settings"):
  # an unset or blank variable takes the default.
  setting = ->(name, default) { ENV[name].to_s.strip.empty? ? default : ENV[name].strip }

  valkey_image = setting.("KAMAL_VALKEY_IMAGE", "valkey/valkey:9.1.3")

  # The server arguments for one Valkey accessory. They start with a flag, so
  # the image's entrypoint runs its own server binary (valkey-server, or
  # redis-server in a Redis image). EXTRA args go last, so they can also
  # override the earlier flags.
  valkey_cmd = lambda do |role, maxmemory:, policy:, persistence:|
    [ "--maxmemory", setting.("KAMAL_VALKEY_#{role}_MAXMEMORY", maxmemory),
      "--maxmemory-policy", setting.("KAMAL_VALKEY_#{role}_POLICY", policy),
      persistence,
      setting.("KAMAL_VALKEY_#{role}_ARGS", "") ].reject(&:empty?).join(" ")
  end

  # The app's Redis-compatible servers, by role. KAMAL_VALKEY_<ROLE>_EXTERNAL=1
  # points a role at an external or managed server instead of its accessory.
  # That server's URL, KAMAL_VALKEY_<ROLE>_URL, may carry a password, so it
  # comes from .kamal/secrets (through any secrets adapter) and reaches the
  # app as a secret, never in env.clear.
  valkey_urls = { "REDIS_URL" => "JOBS", "REDIS_CACHE_URL" => "CACHE", "REDIS_CABLE_URL" => "CABLE" }
  external_valkey = lambda do |role|
    flag, url = "KAMAL_VALKEY_#{role}_EXTERNAL", "KAMAL_VALKEY_#{role}_URL"
    case setting.(flag, "")
    when "1" then true
    when ""
      # A URL in the shell without the flag would otherwise be ignored, and the
      # app silently pointed at the in-cluster accessory instead.
      next false if setting.(url, "").empty?
      raise "#{url} is set but #{flag} isn't. Set #{flag}=1 to use that server, " \
            "or unset #{url} (docs/DEPLOYMENT.md, \"Valkey settings\")."
    else
      raise "#{flag} must be 1 or unset (docs/DEPLOYMENT.md, \"Valkey settings\")."
    end
  end
%>

service: goodsorcery_web

image: <%= ENV.fetch("KAMAL_IMAGE", "creativesorcery/goodsorcery_web") %>

servers:
  web:
    - <%= web_host %>
  job:
    hosts:
      - <%= web_host %>
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Cloudflare terminates TLS; the tunnel reaches kamal-proxy over plain HTTP.
# production.rb sets assume_ssl and force_ssl, so Rails still treats every
# request as HTTPS.
proxy:
  ssl: false
  host: <%= ENV.fetch("GOODSORCERY_HOST") %>
  # Keep the client IP that Cloudflare put in X-Forwarded-For (rate limits
  # and sessions use request.remote_ip).
  forward_headers: true
  run:
    # Don't publish 80/443 on the host: Docker-published ports bypass the
    # firewall, and only cloudflared (on the kamal network) needs the proxy.
    publish: false

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "deploy") %>
  port: <%= ENV.fetch("KAMAL_SSH_PORT", 22) %>

env:
  clear:
    GOODSORCERY_PUBLIC_URL: https://<%= ENV.fetch("GOODSORCERY_HOST") %>
    DB_HOST: goodsorcery_web-db
    # Valkey speaks the Redis protocol; the variables keep their Redis names.
    # Each defaults to its in-cluster accessory (goodsorcery_web-valkey-jobs, ...).
<% valkey_urls.each do |variable, role| %>
<%   unless external_valkey.(role) %>
    <%= variable %>: redis://goodsorcery_web-valkey-<%= role.downcase %>:6379/0
<%   end %>
<% end %>
<% if ENV["GOODSORCERY_MAIL_FROM"].to_s.strip != "" %>
    GOODSORCERY_MAIL_FROM: <%= ENV["GOODSORCERY_MAIL_FROM"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_ENABLE_SIGNUPS"] == "1" %>
    # Keep public sign-up open after the first account (see Signup.open?).
    GOODSORCERY_ENABLE_SIGNUPS: "1"
<% end %>
<% if ENV["GOODSORCERY_DISABLE_SIGNUPS"] == "1" %>
    # Close sign-up entirely, even for the first account; create the owner
    # with bin/rails goodsorcery:create_owner instead (see Signup.open?).
    GOODSORCERY_DISABLE_SIGNUPS: "1"
<% end %>
<% if ENV["GOODSORCERY_HOSTED"].to_s.strip != "" %>
    # Managed hosting: entitlements come from each account (docs/ARCHITECTURE.md §12.2).
    GOODSORCERY_HOSTED: <%= ENV["GOODSORCERY_HOSTED"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_APM_RETENTION_DAYS"].to_s.strip != "" %>
    # Self-hosted performance data retention in days, 1..30 (default 30).
    GOODSORCERY_APM_RETENTION_DAYS: <%= ENV["GOODSORCERY_APM_RETENTION_DAYS"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_UPGRADE_URL"].to_s.strip != "" %>
    GOODSORCERY_UPGRADE_URL: <%= ENV["GOODSORCERY_UPGRADE_URL"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_TERMS_URL"].to_s.strip != "" %>
    # Linked from the sign-up page's agreement sentence.
    GOODSORCERY_TERMS_URL: <%= ENV["GOODSORCERY_TERMS_URL"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_PRIVACY_URL"].to_s.strip != "" %>
    # Linked from the sign-up page's agreement sentence.
    GOODSORCERY_PRIVACY_URL: <%= ENV["GOODSORCERY_PRIVACY_URL"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_ENDPOINT"].to_s.strip != "" %>
    GOODSORCERY_ENDPOINT: <%= ENV["GOODSORCERY_ENDPOINT"].to_json %>
<% end %>
<% if ENV["GOODSORCERY_PERFORMANCE_MONITORING"].to_s.strip != "" %>
    GOODSORCERY_PERFORMANCE_MONITORING: <%= ENV["GOODSORCERY_PERFORMANCE_MONITORING"].to_json %>
<% end %>
  secret:
    - SECRET_KEY_BASE
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - GOODSORCERY_WEB_DATABASE_PASSWORD
<% if ENV["POSTMARK_API_TOKEN"].to_s.strip != "" %>
    # Optional: mail through Postmark's API; without it, configure SMTP
    # (config/environments/production.rb) or run without mail.
    - POSTMARK_API_TOKEN
<% end %>
<% if ENV["GOODSORCERY_API_KEY"].to_s.strip != "" %>
    # Optional: Good Sorcery reports its own errors (config/initializers/goodsorcery.rb).
    - GOODSORCERY_API_KEY
<% end %>
<% valkey_urls.each do |variable, role| %>
<%   if external_valkey.(role) %>
    # Optional: an external Redis-compatible server instead of valkey-<%= role.downcase %>.
    - <%= variable %>:KAMAL_VALKEY_<%= role %>_URL
<%   end %>
<% end %>

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Local Active Storage files.
volumes:
  - "goodsorcery_web_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

builder:
  arch: amd64
  # Layer cache in the registry, so CI builds reuse unchanged layers.
  cache:
    type: registry
    image: <%= ENV.fetch("KAMAL_IMAGE", "creativesorcery/goodsorcery_web") %>-build-cache
    options: mode=max

# Accessories run on the kamal Docker network and publish no ports, so they're
# reachable from the app containers by name (goodsorcery_web-db, ...) but not
# from outside the server. `bin/kamal setup` boots them; `bin/kamal deploy`
# leaves them running.
accessories:
  db:
    image: postgres:18
    host: <%= web_host %>
    env:
      clear:
        POSTGRES_USER: goodsorcery_web
        POSTGRES_DB: goodsorcery_web_production
      secret:
        - POSTGRES_PASSWORD:GOODSORCERY_WEB_DATABASE_PASSWORD
    directories:
      - data:/var/lib/postgresql

  # Three Valkey servers, so each gets the memory policy its data needs and
  # flushing the cache can never touch Sidekiq. maxmemory caps the data; each
  # Docker memory limit sits above it for what maxmemory doesn't count:
  # allocator fragmentation and, for jobs only, the copy-on-write pages of the
  # fork that rewrites the AOF (jobs about 1.5x, cache 1.25x, cable a small
  # floor). That is headroom, not a guarantee: a container over its limit is
  # OOM-killed and restarted (docs/DEPLOYMENT.md, "Sizing"). The defaults suit
  # a 4 GB host; every KAMAL_VALKEY_* setting is optional (docs/DEPLOYMENT.md,
  # "Valkey settings"), and so is each accessory: don't boot one whose role is
  # external. .kamal/hooks/pre-deploy stops a deploy while a needed one isn't
  # running. Host prep (vm.overcommit_memory, swap) is in docs/DEPLOYMENT.md.

  # Sidekiq queues, retries, scheduled jobs and the cron schedule: persisted
  # with the append-only file only (no RDB snapshots, so the AOF rewrite is
  # the only fork) and never evicted (keep noeviction, or Sidekiq can silently
  # lose jobs).
  valkey-jobs:
    image: <%= valkey_image.to_json %>
    host: <%= web_host %>
    cmd: <%= valkey_cmd.("JOBS", maxmemory: "256mb", policy: "noeviction", persistence: '--appendonly yes --save ""').to_json %>
    directories:
      - data:/data
    options:
      memory: <%= setting.("KAMAL_VALKEY_JOBS_MEMORY_LIMIT", "384m").to_json %>

  # Rails cache store (rate limits, quota and key-lookup caches, fragments):
  # evicts the least recently used keys when full and writes nothing to disk.
  valkey-cache:
    image: <%= valkey_image.to_json %>
    host: <%= web_host %>
    cmd: <%= valkey_cmd.("CACHE", maxmemory: "128mb", policy: "allkeys-lru", persistence: '--save "" --appendonly no').to_json %>
    options:
      memory: <%= setting.("KAMAL_VALKEY_CACHE_MEMORY_LIMIT", "160m").to_json %>

  # Action Cable pub/sub: holds no data, so nothing to persist or evict.
  valkey-cable:
    image: <%= valkey_image.to_json %>
    host: <%= web_host %>
    cmd: <%= valkey_cmd.("CABLE", maxmemory: "32mb", policy: "noeviction", persistence: '--save "" --appendonly no').to_json %>
    options:
      memory: <%= setting.("KAMAL_VALKEY_CABLE_MEMORY_LIMIT", "64m").to_json %>

  # Remotely managed tunnel: its public hostname is configured in the
  # Cloudflare dashboard to point at http://kamal-proxy:80.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    host: <%= web_host %>
    cmd: tunnel run
    env:
      secret:
        - TUNNEL_TOKEN:CLOUDFLARE_TUNNEL_TOKEN
